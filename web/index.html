<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div><h1>NIIGO</h1><div class="muted">家庭のタスクを整理</div></div><button id="reload">更新</button></header>
  <div id="error" role="alert"></div>
  <nav id="nav"></nav>
  <main id="main" aria-live="polite">読み込み中…</main>
  <dialog id="editor"><form id="editForm"><h2 id="editorTitle"></h2><div id="fields"></div><div class="actions"><button type="button" data-dismiss="editor">キャンセル</button><button class="primary">保存</button></div></form></dialog>
  <dialog id="closer"><form id="closeForm"><h2>ラウンドを終了</h2><p>未完了のタスクごとに移動先を選んでください。完了したタスクはこのラウンドに残ります。</p><div id="closeFields"></div><div class="actions"><button type="button" data-dismiss="closer">キャンセル</button><button class="primary">終了する</button></div></form></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
